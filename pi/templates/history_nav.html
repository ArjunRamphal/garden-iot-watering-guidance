<section class="sound-toolbar" id="sound-panel" aria-labelledby="sound-title">
  <div class="sound-copy"><h2 id="sound-title">Audible dry warning</h2>
    <p id="sound-status" role="status" aria-live="polite">Sound off</p></div>
  <div class="sound-actions">
    <button type="button" id="sound-toggle" aria-pressed="false">Enable sound</button>
    <button type="button" id="sound-test">Test sound</button>
    <button type="button" id="sound-silence" hidden>Silence this warning</button>
  </div>
</section>
